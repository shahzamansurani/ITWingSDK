name: Create SDK v1.46 tag

on:
  push:
    paths:
      - '.github/workflows/create-v146-tag.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply custom ad lifecycle fix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}")
              file.write_text(text.replace(old, new))

          replace(
              "itwingSDK/build.gradle.kts",
              'val sdkPublicationVersion = providers.gradleProperty("version")\n    .orElse("v1.45")',
              'val sdkPublicationVersion = providers.gradleProperty("version")\n    .orElse("v1.46")',
          )

          replace(
              "itwingSDK/src/main/java/com/itwingtech/itwingsdk/ads/CustomFullscreenAdRenderer.kt",
              '            if (isRewardedPlacement && !ad.isVideo()) rewardEarned.compareAndSet(false, true)',
              '            if (isRewardedPlacement) {\n                rewardEarned.compareAndSet(false, true)\n            }',
          )

          replace(
              "itwingSDK/src/main/java/com/itwingtech/itwingsdk/utils/SDKMediaView.kt",
              '    private var wasPlayingBeforePause =\n        false\n\n    private var internalMuteHidden = false',
              '    private var wasPlayingBeforePause =\n        false\n\n    private var playRequested =\n        false\n\n    private var internalMuteHidden = false',
          )

          replace(
              "itwingSDK/src/main/java/com/itwingtech/itwingsdk/utils/SDKMediaView.kt",
              '        isVideo = video\n\n        if (video) {',
              '        isVideo = video\n        playRequested = false\n\n        if (video) {',
          )

          replace(
              "itwingSDK/src/main/java/com/itwingtech/itwingsdk/utils/SDKMediaView.kt",
              '            playWhenReady = true',
              '            playWhenReady = false',
          )

          replace(
              "itwingSDK/src/main/java/com/itwingtech/itwingsdk/utils/SDKMediaView.kt",
              '    fun play() {\n\n        runCatching {\n\n            player?.play()\n        }\n    }',
              '    fun play() {\n\n        runCatching {\n\n            playRequested =\n                true\n\n            if (canPlayNow()) {\n\n                player?.play()\n\n            } else {\n\n                player?.playWhenReady =\n                    true\n            }\n        }\n    }',
          )

          replace(
              "itwingSDK/src/main/java/com/itwingtech/itwingsdk/utils/SDKMediaView.kt",
              '    fun pause() {\n\n        runCatching {\n\n            player?.pause()\n        }\n    }',
              '    fun pause() {\n\n        runCatching {\n\n            playRequested =\n                false\n\n            player?.pause()\n        }\n    }',
          )

          replace(
              "itwingSDK/src/main/java/com/itwingtech/itwingsdk/utils/SDKMediaView.kt",
              '    fun resume() {\n\n        runCatching {\n\n            player?.play()\n        }\n    }',
              '    fun resume() {\n\n        play()\n    }',
          )

          replace(
              "itwingSDK/src/main/java/com/itwingtech/itwingsdk/utils/SDKMediaView.kt",
              '    fun onHostResume() {\n        runCatching {\n            player?.play()\n        }\n    }',
              '    fun onHostResume() {\n        if (playRequested) {\n            play()\n        }\n    }',
          )

          replace(
              "itwingSDK/src/main/java/com/itwingtech/itwingsdk/utils/SDKMediaView.kt",
              '    fun release() {\n\n        runCatching {\n\n            playerView.player = null',
              '    fun release() {\n\n        runCatching {\n\n            playRequested =\n                false\n\n            playerView.player = null',
          )

          replace(
              "itwingSDK/src/main/java/com/itwingtech/itwingsdk/utils/SDKMediaView.kt",
              '                if (wasPlayingBeforePause) {\n\n                    player?.play()\n                }',
              '                if (wasPlayingBeforePause) {\n\n                    play()\n                }',
          )

          replace(
              "itwingSDK/src/main/java/com/itwingtech/itwingsdk/utils/SDKMediaView.kt",
              '    }\n}',
              '    }\n\n    override fun onAttachedToWindow() {\n        super.onAttachedToWindow()\n        resumeWhenVisible()\n    }\n\n    override fun onDetachedFromWindow() {\n        runCatching {\n            player?.pause()\n        }\n        super.onDetachedFromWindow()\n    }\n\n    override fun onWindowVisibilityChanged(visibility: Int) {\n        super.onWindowVisibilityChanged(visibility)\n        if (visibility == VISIBLE) {\n            resumeWhenVisible()\n        } else {\n            runCatching {\n                player?.pause()\n            }\n        }\n    }\n\n    override fun onVisibilityAggregated(isVisible: Boolean) {\n        super.onVisibilityAggregated(isVisible)\n        if (isVisible) {\n            resumeWhenVisible()\n        } else {\n            runCatching {\n                player?.pause()\n            }\n        }\n    }\n\n    private fun resumeWhenVisible() {\n        if (!playRequested) {\n            return\n        }\n\n        post {\n            runCatching {\n                restorePlayer()\n                if (canPlayNow()) {\n                    player?.play()\n                } else {\n                    player?.playWhenReady = true\n                }\n            }\n        }\n    }\n\n    private fun canPlayNow(): Boolean =\n        isAttachedToWindow &&\n                windowVisibility == VISIBLE &&\n                isShown\n}',
          )
          PY

      - name: Commit and tag v1.46
        shell: bash
        run: |
          git config user.name "IT Wing Technologies"
          git config user.email "120798377+shahzamansurani@users.noreply.github.com"
          rm -f .github/workflows/create-v146-tag.yml
          git add itwingSDK/build.gradle.kts \
                  itwingSDK/src/main/java/com/itwingtech/itwingsdk/ads/CustomFullscreenAdRenderer.kt \
                  itwingSDK/src/main/java/com/itwingtech/itwingsdk/utils/SDKMediaView.kt \
                  .github/workflows/create-v146-tag.yml
          git commit -m "Release SDK v1.46 custom ad lifecycle fixes"
          git tag -f v1.46
          git push origin HEAD:master
          git push origin refs/tags/v1.46 --force
