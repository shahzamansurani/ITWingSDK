name: Create SDK v1.44 tag

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/create-v144-tag.yml'

permissions:
  contents: write

jobs:
  create-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create clean v1.44 tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "itwingtech"
          git config user.email "shahab.itwing@gmail.com"
          git rm --ignore-unmatch .github/workflows/create-v144-tag.yml
          git commit -m "Release SDK v1.44"
          git tag -f v1.44
          git push origin HEAD:master
          git push --force origin refs/tags/v1.44
