name: Create SDK v1.45 tag

on:
  push:
    paths:
      - '.github/workflows/create-v145-tag.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply native CTA layout fix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}")
              file.write_text(text.replace(old, new))

          replace(
              "itwingSDK/build.gradle.kts",
              'val sdkPublicationVersion = providers.gradleProperty("version")\n    .orElse("v1.44")',
              'val sdkPublicationVersion = providers.gradleProperty("version")\n    .orElse("v1.45")',
          )

          replace(
              "itwingSDK/src/main/res/layout/custom_native_large.xml",
              '        <LinearLayout\n            android:layout_width="match_parent"\n            android:layout_height="260dp"\n            android:orientation="vertical">',
              '        <LinearLayout\n            android:layout_width="match_parent"\n            android:layout_height="wrap_content"\n            android:orientation="vertical">',
          )

          replace(
              "itwingSDK/src/main/res/layout/custom_native_large.xml",
              '            <androidx.appcompat.widget.AppCompatButton\n                android:id="@+id/ad_call_to_action"\n                android:layout_width="match_parent"\n                android:layout_height="@dimen/_35sdp"\n                android:layout_margin="@dimen/_2sdp"\n                android:background="@drawable/start_bg"\n                android:gravity="center"\n                android:textColor="@color/white"\n                android:textSize="@dimen/_10ssp"\n                android:textStyle="bold" />',
              '            <androidx.appcompat.widget.AppCompatButton\n                android:id="@+id/ad_call_to_action"\n                android:layout_width="match_parent"\n                android:layout_height="@dimen/_35sdp"\n                android:layout_margin="@dimen/_2sdp"\n                android:background="@drawable/start_bg"\n                android:ellipsize="end"\n                android:gravity="center"\n                android:includeFontPadding="false"\n                android:maxLines="1"\n                android:minHeight="0dp"\n                android:minWidth="0dp"\n                android:paddingStart="@dimen/_8sdp"\n                android:paddingTop="0dp"\n                android:paddingEnd="@dimen/_8sdp"\n                android:paddingBottom="0dp"\n                android:textColor="@color/white"\n                android:textSize="@dimen/_10ssp"\n                android:textStyle="bold" />',
          )

          replace(
              "itwingSDK/src/main/res/layout/custom_native_small.xml",
              '                <androidx.appcompat.widget.AppCompatButton\n                    android:id="@+id/ad_call_to_action"\n                    android:layout_width="match_parent"\n                    android:layout_height="40dp"\n                    android:background="@drawable/start_bg"\n                    android:gravity="center"\n                    android:textColor="@color/white"\n                    android:textSize="12sp" />',
              '                <androidx.appcompat.widget.AppCompatButton\n                    android:id="@+id/ad_call_to_action"\n                    android:layout_width="match_parent"\n                    android:layout_height="40dp"\n                    android:background="@drawable/start_bg"\n                    android:ellipsize="end"\n                    android:gravity="center"\n                    android:includeFontPadding="false"\n                    android:maxLines="1"\n                    android:minHeight="0dp"\n                    android:minWidth="0dp"\n                    android:paddingStart="@dimen/_8sdp"\n                    android:paddingTop="0dp"\n                    android:paddingEnd="@dimen/_8sdp"\n                    android:paddingBottom="0dp"\n                    android:textColor="@color/white"\n                    android:textSize="12sp" />',
          )

          replace(
              "itwingSDK/src/main/java/com/itwingtech/itwingsdk/ads/NativeLoader.kt",
              'import android.os.Bundle\nimport android.view.LayoutInflater',
              'import android.os.Bundle\nimport android.text.TextUtils\nimport android.view.Gravity\nimport android.view.LayoutInflater',
          )

          replace(
              "itwingSDK/src/main/java/com/itwingtech/itwingsdk/ads/NativeLoader.kt",
              '        nativeAd.callToAction?.let {\n            (adView.callToActionView as? Button)?.text = it\n            adView.callToActionView?.visibility = View.VISIBLE\n        } ?: run {',
              '        nativeAd.callToAction?.let {\n            (adView.callToActionView as? Button)?.apply {\n                text = it\n                normalizeNativeCtaButton()\n            }\n            adView.callToActionView?.visibility = View.VISIBLE\n        } ?: run {',
          )

          replace(
              "itwingSDK/src/main/java/com/itwingtech/itwingsdk/ads/NativeLoader.kt",
              '        ctaView?.text =\n            ad.cta?.takeIf {\n                it.isNotBlank()\n            }\n                ?: "Install"\n\n        advertiserView?.text =',
              '        ctaView?.text =\n            ad.cta?.takeIf {\n                it.isNotBlank()\n            }\n                ?: "Install"\n        ctaView?.normalizeNativeCtaButton()\n\n        advertiserView?.text =',
          )

          replace(
              "itwingSDK/src/main/java/com/itwingtech/itwingsdk/ads/NativeLoader.kt",
              '    private fun sdkColor(vararg names: String): String? =\n        names.firstNotNullOfOrNull { name -> ITWingSDK.getColor(name).takeIf { it.isNotBlank() } }\n\n    private fun CustomAdConfig.brandName(): String? =',
              '    private fun sdkColor(vararg names: String): String? =\n        names.firstNotNullOfOrNull { name -> ITWingSDK.getColor(name).takeIf { it.isNotBlank() } }\n\n    private fun Button.normalizeNativeCtaButton() {\n        minHeight = 0\n        minimumHeight = 0\n        minWidth = 0\n        minimumWidth = 0\n        maxLines = 1\n        ellipsize = TextUtils.TruncateAt.END\n        gravity = Gravity.CENTER\n        setIncludeFontPadding(false)\n        setPadding(dp(8), 0, dp(8), 0)\n    }\n\n    private fun View.dp(value: Int): Int =\n        (value * resources.displayMetrics.density).toInt()\n\n    private fun CustomAdConfig.brandName(): String? =',
          )
          PY

      - name: Commit and tag v1.45
        shell: bash
        run: |
          git config user.name "IT Wing Technologies"
          git config user.email "120798377+shahzamansurani@users.noreply.github.com"
          rm -f .github/workflows/create-v145-tag.yml
          git add itwingSDK/build.gradle.kts \
                  itwingSDK/src/main/java/com/itwingtech/itwingsdk/ads/NativeLoader.kt \
                  itwingSDK/src/main/res/layout/custom_native_small.xml \
                  itwingSDK/src/main/res/layout/custom_native_large.xml \
                  .github/workflows/create-v145-tag.yml
          git commit -m "Release SDK v1.45 native CTA layout fix"
          git tag -f v1.45
          git push origin HEAD:master
          git push origin refs/tags/v1.45 --force
